[project]
name = "agent-ledger"
version = "0.1.0"
description = "MCPの設定とAgent SkillsからAIエージェント台帳を作る"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
agent-ledger = "agent_ledger.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent_ledger"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108"]
